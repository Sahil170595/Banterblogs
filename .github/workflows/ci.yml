name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: "Regenerate the visual job's screenshot baselines and upload them as the visual-snapshots artifact"
        type: boolean
        default: false

jobs:
  build:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "banterblogs-nextjs/package-lock.json"

      - name: Install dependencies
        working-directory: ./banterblogs-nextjs
        run: npm ci

      - name: Lint
        working-directory: ./banterblogs-nextjs
        run: npm run lint

      - name: Run Tests
        working-directory: ./banterblogs-nextjs
        run: npm test -- --run # Run once, not in watch mode

      # Type-checking and the build-time invariants (reports.json count
      # reconciliation, catalog completeness, phase-slug resolution) only run
      # inside `next build` — without this step they never gate a merge.
      - name: Build
        working-directory: ./banterblogs-nextjs
        run: npm run build

  # Route and visual checks (banterblogs-nextjs/e2e/README.md) against a
  # production build, in the Playwright image whose version matches
  # @playwright/test, so screenshots render the same on every run.
  visual:
    name: Route and visual checks
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # the runner's own uid, so the checkout and caches stay writable
      options: --user 1001
    timeout-minutes: 30
    env:
      # e2e/__snapshots__ holds the baselines from an update_snapshots run
      # (regenerate the same way when a page changes on purpose)
      VISUAL_SCREENSHOTS: "on"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "banterblogs-nextjs/package-lock.json"

      - name: Install dependencies
        working-directory: ./banterblogs-nextjs
        run: npm ci

      - name: Type-check the e2e suite
        working-directory: ./banterblogs-nextjs
        run: npx tsc -p e2e/tsconfig.json

      - name: Build
        working-directory: ./banterblogs-nextjs
        run: npm run build

      - name: Check routes
        if: ${{ !inputs.update_snapshots }}
        working-directory: ./banterblogs-nextjs
        run: npx playwright test

      - name: Regenerate screenshot baselines
        if: ${{ inputs.update_snapshots }}
        working-directory: ./banterblogs-nextjs
        env:
          VISUAL_SCREENSHOTS: "on"
        run: npx playwright test --grep @screenshot --update-snapshots=all

      - name: Upload screenshot baselines
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: banterblogs-nextjs/e2e/__snapshots__/
          if-no-files-found: error

      - name: Upload the report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            banterblogs-nextjs/playwright-report/
            banterblogs-nextjs/test-results/
          if-no-files-found: ignore
